<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <pattern id="bata" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#8E4B36"/>
      <rect x="2" y="2" width="116" height="26" rx="3" fill="#A65A41"/>
      <rect x="-58" y="32" width="116" height="26" rx="3" fill="#9C543C"/>
